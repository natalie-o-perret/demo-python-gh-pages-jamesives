name: Publish docs

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-docs.txt
      - name: Build docs
        run: make html
      - name: Disable Jekyll
        run: touch build/html/.nojekyll
      - name: Publish
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/html
